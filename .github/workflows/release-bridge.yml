name: release-bridge
# Publishes @dossyai/mcp-bridge to npm with provenance when a bridge-v<version> tag is pushed.
# Run it by hand for a dry run that builds, tests, stages, and packs without publishing.
#
# Authentication: npm trusted publishing (OIDC), with no NPM_TOKEN secret.
# Package settings must trust owner ammbo, repository dossy, workflow release-bridge.yml,
# no environment, and allow direct npm publish (new configurations default to stage-only).
on:
  push:
    tags: ["bridge-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Set up npm for trusted publishing
        run: |
          npm install -g npm@^11.5.1
          node --version
          npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./packages/mcp-bridge/package.json').version")
          if [ "$GITHUB_REF_NAME" != "bridge-v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match @dossyai/mcp-bridge $version." >&2
            exit 1
          fi
      - run: node scripts/stage-bridge.mjs
      - name: Publish
        working-directory: packages/mcp-bridge/dist/npm
        # npm otherwise hides a rejected OIDC exchange behind a generic ENEEDAUTH error.
        run: npm publish --provenance --access public --loglevel verbose ${{ github.ref_type == 'tag' && ' ' || '--dry-run' }}
